<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autumn Burst - Fall Match-4 Puzzle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🍂 Autumn Burst 🍂</h1>
            <div class="player-info">
                <div class="player-name-container">
                    <label for="playerName">Player:</label>
                    <div class="input-wrapper">
                        <input type="text" id="playerName" class="player-name-input" placeholder="Enter your name" maxlength="20">
                        <span class="keyboard-indicator" title="Touch-friendly keyboard available">⌨️</span>
                    </div>
                </div>
            </div>
            <div class="score-board">
                <div class="score">
                    <span class="label">Score:</span>
                    <span id="score">0</span>
                </div>
                <div class="combo">
                    <span class="label">Combo:</span>
                    <span id="combo">0x</span>
                </div>
            </div>
        </header>
        
        <main class="game-main">
            <div class="game-board-container">
                <canvas id="gameBoard" width="480" height="480"></canvas>
                <div class="game-overlay" id="gameOverlay" style="display: none;">
                    <div class="overlay-content">
                        <h2>Game Over!</h2>
                        <p>Final Score: <span id="finalScore">0</span></p>
                        <button id="restartBtn" class="btn btn-primary">Play Again</button>
                    </div>
                </div>
            </div>
            
            <div class="game-info">
                <div class="next-icons">
                    <h3>Next Icons:</h3>
                    <div id="nextIcons" class="next-preview"></div>
                </div>
                
                <div class="instructions">
                    <h3>How to Play:</h3>
                    <ul>
                        <li>Click to select an icon</li>
                        <li>Click adjacent icon to swap</li>
                        <li>Match 4+ identical icons to burst</li>
                        <li>Create combos for bonus points</li>
                    </ul>
                </div>
                
                <div class="controls">
                    <button id="pauseBtn" class="btn btn-secondary">Pause</button>
                    <button id="newGameBtn" class="btn btn-primary">New Game</button>
                </div>
            </div>
        </main>
    </div>
    
    <!-- On-Screen Keyboard -->
    <div id="onScreenKeyboard" class="on-screen-keyboard">
        <div class="keyboard-header">
            <span class="keyboard-title">🍂 Virtual Keyboard</span>
            <button id="keyboardClose" class="keyboard-close-btn">×</button>
        </div>
        <div class="keyboard-rows">
            <div class="keyboard-row">
                <button class="key" data-key="1">1</button>
                <button class="key" data-key="2">2</button>
                <button class="key" data-key="3">3</button>
                <button class="key" data-key="4">4</button>
                <button class="key" data-key="5">5</button>
                <button class="key" data-key="6">6</button>
                <button class="key" data-key="7">7</button>
                <button class="key" data-key="8">8</button>
                <button class="key" data-key="9">9</button>
                <button class="key" data-key="0">0</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="q">Q</button>
                <button class="key" data-key="w">W</button>
                <button class="key" data-key="e">E</button>
                <button class="key" data-key="r">R</button>
                <button class="key" data-key="t">T</button>
                <button class="key" data-key="y">Y</button>
                <button class="key" data-key="u">U</button>
                <button class="key" data-key="i">I</button>
                <button class="key" data-key="o">O</button>
                <button class="key" data-key="p">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="a">A</button>
                <button class="key" data-key="s">S</button>
                <button class="key" data-key="d">D</button>
                <button class="key" data-key="f">F</button>
                <button class="key" data-key="g">G</button>
                <button class="key" data-key="h">H</button>
                <button class="key" data-key="j">J</button>
                <button class="key" data-key="k">K</button>
                <button class="key" data-key="l">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key key-caps" data-key="caps">🔠</button>
                <button class="key" data-key="z">Z</button>
                <button class="key" data-key="x">X</button>
                <button class="key" data-key="c">C</button>
                <button class="key" data-key="v">V</button>
                <button class="key" data-key="b">B</button>
                <button class="key" data-key="n">N</button>
                <button class="key" data-key="m">M</button>
                <button class="key key-backspace" data-key="backspace">⌫</button>
            </div>
            <div class="keyboard-row">
                <button class="key key-symbols" data-key="symbols">!@#</button>
                <button class="key key-space" data-key="space">Space</button>
                <button class="key key-enter" data-key="enter">Enter</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
